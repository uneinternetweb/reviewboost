name: Build Review Boost Agent Universal

on:
  workflow_dispatch:
  push:
    branches:
      - agent/access-x86-support
    paths:
      - 'reviewboost_agent/**'
      - 'requirements.txt'
      - 'pyinstaller.spec'
      - 'installer/reviewboost-agent-universal.iss'
      - '.github/workflows/build-agent-universal.yml'

jobs:
  build:
    strategy:
      matrix:
        arch: [x86, x64]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 ${{ matrix.arch }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Verify Python architecture
        shell: pwsh
        run: |
          $bits = python -c "import struct; print(struct.calcsize('P') * 8)"
          if ('${{ matrix.arch }}' -eq 'x86' -and $bits -ne '32') { throw "Expected 32-bit Python, got $bits-bit" }
          if ('${{ matrix.arch }}' -eq 'x64' -and $bits -ne '64') { throw "Expected 64-bit Python, got $bits-bit" }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller pyinstaller.spec --clean --noconfirm

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: dist/reviewboost-agent.exe
          if-no-files-found: error

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x86 executable
        uses: actions/download-artifact@v4
        with:
          name: agent-x86
          path: package/x86

      - name: Download x64 executable
        uses: actions/download-artifact@v4
        with:
          name: agent-x64
          path: package/x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build universal installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/reviewboost-agent-universal.iss

      - name: Upload universal installer
        uses: actions/upload-artifact@v4
        with:
          name: ReviewBoostAgentSetup
          path: installer/Output/ReviewBoostAgentSetup.exe
          if-no-files-found: error
